# Tower fan request contracts, aligned with pyvesync devices/vesyncfan.py.
# Authentication headers and metadata are supplied by Helpers at runtime.
update:
  method: post
  url: /cloud/v2/deviceManaged/bypassV2
  json_object:
    method: bypassV2
    cid: LTF-F422_WJP-CID
    configModule: ConfigModule
    payload:
      method: getTowerFanStatus
      source: APP
      data: {}
turn_on:
  method: post
  url: /cloud/v2/deviceManaged/bypassV2
  json_object:
    method: bypassV2
    cid: LTF-F422_WJP-CID
    configModule: ConfigModule
    payload:
      method: setSwitch
      source: APP
      data:
        powerSwitch: 1
        switchIdx: 0
turn_off:
  method: post
  url: /cloud/v2/deviceManaged/bypassV2
  json_object:
    method: bypassV2
    cid: LTF-F422_WJP-CID
    configModule: ConfigModule
    payload:
      method: setSwitch
      source: APP
      data:
        powerSwitch: 0
        switchIdx: 0
